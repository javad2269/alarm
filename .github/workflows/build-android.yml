name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install

      - name: Generate PNG from SVG
        run: node scripts/gen-assets.js

      - name: Save custom Android files
        run: |
          mkdir -p /tmp/android-custom
          if [ -d android ]; then cp -r android /tmp/android-custom/; fi

      - name: Remove old android folder
        run: rm -rf android

      - name: Add Android platform
        run: npx cap add android

      - name: Add google-services.json
        env:
          GS: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: echo "$GS" > android/app/google-services.json

      - name: Patch Gradle for Firebase + Messaging
        run: |
          sed -i "/classpath 'com.android.tools.build:gradle'/a \        classpath 'com.google.gms:google-services:4.4.0'" android/build.gradle
          echo "apply plugin: 'com.google.gms.google-services'" >> android/app/build.gradle
          sed -i "/dependencies {/a \    implementation 'com.google.firebase:firebase-messaging:23.4.0'" android/app/build.gradle

      - name: Restore custom Android files
        run: |
          mkdir -p android/app/src/main/java/app/alarm/saham/
          mkdir -p android/app/src/main/res/raw/
          if [ -d /tmp/android-custom/android ]; then
            cp -r /tmp/android-custom/android/app/src/main/java/app/alarm/saham/. android/app/src/main/java/app/alarm/saham/ 2>/dev/null || true
            cp -r /tmp/android-custom/android/app/src/main/res/raw/. android/app/src/main/res/raw/ 2>/dev/null || true
          fi

      # ⭐ FIX: اضافه کردن همه مجوزها (شامل storage برای Filesystem)
      - name: Patch AndroidManifest (Full-Screen Intent + Service + Storage)
        run: |
          sed -i 's|<application|<uses-permission android:name="android.permission.USE_FULL_SCREEN_INTENT" />\n    <uses-permission android:name="android.permission.WAKE_LOCK" />\n    <uses-permission android:name="android.permission.VIBRATE" />\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="28" />\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />\n    <uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />\n    <application|' android/app/src/main/AndroidManifest.xml
          sed -i 's|</application>|<service android:name="app.alarm.saham.AlarmMessagingService" android:exported="false"><intent-filter><action android:name="com.google.firebase.MESSAGING_EVENT"/></intent-filter></service>\n    </application>|' android/app/src/main/AndroidManifest.xml

      - name: Set Persian app name
        run: |
          sed -i 's|<string name="app_name">.*</string>|<string name="app_name">هشدار سهام</string>|' android/app/src/main/res/values/strings.xml
          sed -i 's|<string name="title_activity_main">.*</string>|<string name="title_activity_main">هشدار سهام</string>|' android/app/src/main/res/values/strings.xml

      - name: Generate icons and splash
        run: npx capacitor-assets generate --android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: alarm-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
